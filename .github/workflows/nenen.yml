name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'cucubillgates'
        required: true
        default: 'cucubillgates'
      agent_description:
        description: 'cucubillgates'
        required: true
        default: 'cucubillgates AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run:  |
          node scripts/createNewEthereumIdentity.js > identity.txt
          cat identity.txt

      - name: Save Wallet as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-cucubillgates
          path: identity.txt
          retention-days: 90

      - name: Step 3 - Link Human to Agent
        run:  |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "cucubillgates", "description": "cucubillgates AI Agent"}'
