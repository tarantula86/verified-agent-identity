name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity --force

      - name: Install script dependencies
        run: cd scripts && npm install && cd..

      - name: Step 2 - Create Ethereum Identity + Wallet 0x
        run:  |
          node scripts/createNewEthereumIdentity.js
          echo "Address: $(cat ~/.openclaw/billions/kms.json | jq -r '.keys[0].address')" > wallet.txt
          echo "Private Key: $(cat ~/.openclaw/billions/kms.json | jq -r '.keys[0].privateKey')" >> wallet.txt

      - name: Save Wallet as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-wallet-cucubillgates
          path: wallet.txt
          retention-days: 90

      - name: Step 3 - Link Human to Agent
        run:  |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "cucubillgates", "description": "cucubillgates AI Agent"}'
